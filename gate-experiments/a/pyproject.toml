[project]
name = "batchgate"
version = "0.1.0"
description = "Feasibility gate for within-batch error correlation in batched LLM annotation"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
data = ["datasets>=2.19"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
batchgate = "batchgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batchgate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["datasets.*", "huggingface_hub.*", "vllm.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
