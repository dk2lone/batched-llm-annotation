[project]
name = "gatek"
version = "0.1.0"
description = "Feasibility gate for idea K: does LLM tabular failure follow distance concentration?"
requires-python = ">=3.11,<3.13"
dependencies = [
    # NumPy 2.3+ ships typing syntax that mypy cannot parse when checking the
    # package's supported Python 3.11 target.
    "numpy>=1.26,<2.3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
# Only needed on the GPU host for `gatek run --backend transformers`.
llm = [
    "torch>=2.4",
    "transformers>=4.56",
    "accelerate>=0.30",
]
# Only needed for `gatek prepare-openml`. Never imported by tests.
openml = [
    "pandas>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
gatek = "gatek.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gatek"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/gatek", "tests"]
ignore_missing_imports = true
# NumPy's ndarray shape/dtype generics add noise without improving this gate's
# runtime checks. Keep strict checking for the rest of the Python surface.
disallow_any_generics = false
warn_return_any = false
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
