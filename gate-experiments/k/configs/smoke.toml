# Tiny, network-free end-to-end check. Not evidence about any model.
name = "smoke"
out_dir = "artifacts/smoke"

[synthetic]
dims = [2, 8]
seeds = [0]
n_demo = 8
n_query = 4
cluster_offset = 2.0
cluster_sigma = 0.45
margin = 0.75
nuisance_scale = 1.0
dense_column_scale = "unit_std"
number_format = "{:+08.3f}"

[plan]
ablation_dims = [8]
n_ablated_rows = 2
random_removal_excludes_nearest = true
order_seed = 12345
ordering_dims = [8]
include_attention_job = true
attention_dims = [8]

[run]
backend = "mock"
repr_distance = "cosine"
max_prompt_tokens = 16000
mock_seed = 7
mock_repr_dim = 32

[gate]
# Loosened for the mock backend so the smoke test exercises every branch.
min_classical_accuracy = 0.60
min_anchor_accuracy = 0.50
max_anchor_parse_failure_rate = 0.02
min_nuisance_raw_contrast_ratio = 1.2
min_repr_contrast_ratio = 1.1
min_sparse_minus_dense_accuracy = 0.05
min_sparse_minus_dense_ablation_delta = 0.05
high_dims = [8]
sensitivity_scale = 0.2
