name: b4 pod watchdog
run-name: b4 watchdog ${{ inputs.lease_id }}

on:
  workflow_dispatch:
    inputs:
      lease_id:
        description: sixteen lowercase hex characters
        required: true
        type: string
      deadline_utc:
        description: UTC deletion target no more than five hours ahead
        required: true
        type: string
      expected_pods:
        description: number of Pods in this lease
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: b4-watchdog-${{ inputs.lease_id }}
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: study-120h/runpod_watchdog.py
          sparse-checkout-cone-mode: false

      - name: watch Runpod lease
        env:
          RUNPOD_API_KEY: ${{ secrets.B4_RUNPOD_WATCHDOG_KEY }}
        run: |
          python study-120h/runpod_watchdog.py \
            --lease-id '${{ inputs.lease_id }}' \
            --deadline-utc '${{ inputs.deadline_utc }}' \
            --expected-pods '${{ inputs.expected_pods }}' \
            --audit watchdog.jsonl

      - name: retain watchdog audit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b4-watchdog-${{ inputs.lease_id }}
          path: watchdog.jsonl
          if-no-files-found: error
          retention-days: 90
