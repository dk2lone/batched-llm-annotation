name: build b4 runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: b4-runtime-build
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: study-120h/extension-b4/runpod
          sparse-checkout-cone-mode: true

      - name: free temporary hosted-runner SDK space
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = true
          # This throwaway image-build runner does not use the preinstalled SDKs.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: build and verify pinned runtime
        shell: bash
        run: |
          docker build --platform linux/amd64 --progress plain \
            --tag ghcr.io/dk2lone/b4-a100-runtime:${GITHUB_SHA} \
            study-120h/extension-b4/runpod
          docker run --rm --entrypoint /opt/b4/bin/python \
            ghcr.io/dk2lone/b4-a100-runtime:${GITHUB_SHA} \
            -c 'import sys; from importlib.metadata import version; assert sys.version_info[:2] == (3,11); expected={"vllm":"0.28.0","huggingface-hub":"1.31.0","numpy":"2.2.6","scipy":"1.16.3"}; assert all(version(p)==v for p,v in expected.items()); print("pinned CPU runtime checks passed")'

      - name: publish runtime without project code or data
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username dk2lone --password-stdin
          docker push ghcr.io/dk2lone/b4-a100-runtime:${GITHUB_SHA}
          docker inspect --format '{{join .RepoDigests "\n"}}' \
            ghcr.io/dk2lone/b4-a100-runtime:${GITHUB_SHA}
          docker logout ghcr.io
